<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="blockedtitle">Site unavailable</title>
  <link rel="stylesheet" href="styles/blocked.css" />
  <link rel="stylesheet" href="styles/common.css" />
</head>
<body>
  <main class="container" aria-labelledby="blockedHeading">
    <h1 id="blockedHeading" data-i18n="blockedheader">This site is currently unavailable</h1>
    <p id="blockedReason" data-i18n="blockedtext">This content cannot be displayed.</p>
    <button id="closeBtn" type="button" aria-describedby="closeStatus" data-i18n="blockedbutton">Close Tab</button>
    <p id="closeStatus" class="page-status" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <script src="scripts/blocked.js" type="module"></script>
</body>
</html>
