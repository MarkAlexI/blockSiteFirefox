name: Firefox Desktop extension E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: firefox-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenarios:
    name: scenarios (${{ matrix.group }})
    runs-on: ubuntu-24.04
    # Slow apt/browser setup consumed over 10 minutes in run 39855086581.
    # Reserve setup/report time separately from the core-scenario step below.
    # Individual scenario deadlines and retries remain unchanged.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [core, overdue, upgrade]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install test dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Firefox Developer Edition and geckodriver
        env:
          BD_E2E_GROUP: ${{ matrix.group }}
        run: |
          # The default Azure mirror stalled while installing PulseAudio in
          # run 41916846967. Keep signed APT packages and bound mirror transport.
          test -f /etc/apt/apt-mirrors.txt
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' |
            sudo tee /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/apt.conf.d/80blockdistraction-ci <<'APT'
          Acquire::Retries "2";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT::Update::Error-Mode "any";
          APT
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-0 libdbus-glib-1-2 libasound2t64 libxt6t64 libnss3 libgbm1 xvfb xauth openssl openbox x11-utils xdotool
          if [ "$BD_E2E_GROUP" = core ] || [ "$BD_E2E_GROUP" = upgrade ]; then
            sudo apt-get install --no-install-recommends -y pulseaudio
          fi
          mkdir -p "$RUNNER_TEMP/bd-firefox"
          cd "$RUNNER_TEMP/bd-firefox"
          curl --fail --location --retry 3 https://archive.mozilla.org/pub/devedition/releases/158.0b2/linux-x86_64/en-US/firefox-158.0b2.tar.xz -o firefox.tar.xz
          curl --fail --location --retry 3 https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz -o geckodriver.tar.gz
          sha256sum --check <<'SHA'
          42168b597c329bb0066a9289ed33b25c520b365d301f7ef0674017a732d4a634  firefox.tar.xz
          e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e  geckodriver.tar.gz
          SHA
          tar --no-same-owner -xJf firefox.tar.xz
          tar --no-same-owner -xzf geckodriver.tar.gz
          echo "BD_FIREFOX_BINARY=$RUNNER_TEMP/bd-firefox/firefox/firefox" >> "$GITHUB_ENV"
          echo "BD_GECKODRIVER=$RUNNER_TEMP/bd-firefox/geckodriver" >> "$GITHUB_ENV"
      - name: Prepare native audio output
        if: matrix.group == 'core' || matrix.group == 'upgrade'
        timeout-minutes: 2
        run: bash e2e/start-audio.sh
      - name: Build and unpack the AMO runtime package
        run: |
          npm run package:amo
          python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          root = Path(os.environ['RUNNER_TEMP'])
          target = root / 'bd-e2e-extension'
          archive, = Path('dist').glob('*-amo.zip')
          with zipfile.ZipFile(archive) as package:
              assert package.testzip() is None
              package.extractall(target)
          with Path(os.environ['GITHUB_ENV']).open('a') as env:
              env.write(f'BD_EXTENSION_PATH={target}\n')
          PY
      - name: Prepare both pinned previous-version runtimes
        if: matrix.group == 'upgrade'
        timeout-minutes: 2
        run: node e2e/prepare-upgrade-baseline.mjs
      - name: Run Firefox Desktop scenarios
        timeout-minutes: 25
        working-directory: e2e
        env:
          BD_E2E_GROUP: ${{ matrix.group }}
        run: xvfb-run -a npm run test:headed
      - name: Upload reports, screenshots and browser logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bd-firefox-e2e-${{ github.sha }}-${{ matrix.group }}
          path: |
            e2e/test-results/
            e2e/results.json
            dist/*-amo.zip.sha256
            dist/*-amo.zip.build.json
          if-no-files-found: warn
          retention-days: 14

  macos:
    name: macos-smoke (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    env:
      BD_E2E_GROUP: macos-smoke
      BD_EXPECTED_ARCH: ${{ matrix.architecture }}
      BD_INSTALLATION: persistent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Record and validate native macOS runner
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';
          import os from 'node:os';
          const evidence = { platform: process.platform, architecture: process.arch,
            expectedArchitecture: process.env.BD_EXPECTED_ARCH, node: process.version,
            osVersion: os.version(), osRelease: os.release(), imageVersion: process.env.ImageVersion,
            group: process.env.BD_E2E_GROUP };
          await writeFile('e2e/macos-environment.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(evidence);
          assert.equal(evidence.platform, 'darwin');
          assert.equal(evidence.architecture, evidence.expectedArchitecture);
          JS
      - name: Install test dependencies
        timeout-minutes: 3
        working-directory: e2e
        run: npm ci
      - name: Install pinned macOS Firefox Developer Edition and geckodriver
        timeout-minutes: 7
        run: bash e2e/setup-macos-firefox.sh
      - name: Build and unpack the AMO runtime package
        run: |
          npm run package:amo
          python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          target = Path(os.environ['RUNNER_TEMP']) / 'bd-e2e-extension'
          archive, = Path('dist').glob('*-amo.zip')
          with zipfile.ZipFile(archive) as package:
              assert package.testzip() is None
              package.extractall(target)
          with Path(os.environ['GITHUB_ENV']).open('a') as env:
              env.write(f'BD_EXTENSION_PATH={target}\n')
          PY
      - name: Run 24 headed macOS acceptance scenarios
        timeout-minutes: 15
        working-directory: e2e
        run: npm run test:headed
      - name: Require all 24 native scenario bodies to pass
        run: node e2e/verify-macos-result.mjs
      - name: Upload macOS result and runtime provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bd-firefox-macos-${{ github.sha }}-${{ matrix.architecture }}
          path: |
            e2e/results.json
            e2e/macos-environment.json
            dist/*-amo.zip.sha256
            dist/*-amo.zip.build.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload macOS failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: bd-firefox-macos-failure-${{ github.sha }}-${{ matrix.architecture }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 3

  compatibility:
    name: Firefox ${{ matrix.label }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 128 ESR
            archive: 128.0esr
            group: compatibility
            sha256: 4f16334b814d7852a0e52d6f7c4c78623c98c0521bafd7192107a24694e14a3e
    env:
      BD_E2E_GROUP: ${{ matrix.group }}
      # geckodriver 0.35 predates --allow-system-access; Firefox 128 does not
      # require that newer driver flag for chrome-context test automation.
      BD_GECKODRIVER_LEGACY: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install test dependencies
        timeout-minutes: 2
        working-directory: e2e
        run: npm ci
      - name: Install Linux browser dependencies
        timeout-minutes: 5
        run: |
          test -f /etc/apt/apt-mirrors.txt
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' |
            sudo tee /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/apt.conf.d/80blockdistraction-ci <<'APT'
          Acquire::Retries "2";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT::Update::Error-Mode "any";
          APT
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-0 libdbus-glib-1-2 libasound2t64 libxt6t64 libnss3 libgbm1 openssl xvfb xauth openbox x11-utils xdotool
      - name: Install pinned Firefox ${{ matrix.archive }} and geckodriver 0.35.0
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/bd-firefox-compatibility"
          cd "$RUNNER_TEMP/bd-firefox-compatibility"
          curl --fail --location --retry 3 https://archive.mozilla.org/pub/firefox/releases/${{ matrix.archive }}/linux-x86_64/en-US/firefox-${{ matrix.archive }}.tar.bz2 -o firefox.tar.bz2
          curl --fail --location --retry 3 https://github.com/mozilla/geckodriver/releases/download/v0.35.0/geckodriver-v0.35.0-linux64.tar.gz -o geckodriver.tar.gz
          sha256sum --check <<'SHA'
          ${{ matrix.sha256 }}  firefox.tar.bz2
          ac26e9ba8f3b8ce0fbf7339b9c9020192f6dcfcbf04a2bcd2af80dfe6bb24260  geckodriver.tar.gz
          SHA
          tar --no-same-owner -xjf firefox.tar.bz2
          tar --no-same-owner -xzf geckodriver.tar.gz
          echo "BD_FIREFOX_BINARY=$RUNNER_TEMP/bd-firefox-compatibility/firefox/firefox" >> "$GITHUB_ENV"
          echo "BD_GECKODRIVER=$RUNNER_TEMP/bd-firefox-compatibility/geckodriver" >> "$GITHUB_ENV"
      - name: Build and unpack the AMO runtime package
        run: |
          npm run package:amo
          python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          target = Path(os.environ['RUNNER_TEMP']) / 'bd-compatibility-extension'
          archive, = Path('dist').glob('*-amo.zip')
          with zipfile.ZipFile(archive) as package:
              assert package.testzip() is None
              package.extractall(target)
          with Path(os.environ['GITHUB_ENV']).open('a') as env:
              env.write(f'BD_EXTENSION_PATH={target}\n')
          PY
      - name: Run seven native compatibility scenarios
        timeout-minutes: 6
        working-directory: e2e
        run: xvfb-run -a npm run test:headed
      - name: Require the pinned browser and all seven scenario bodies
        run: node e2e/verify-compatibility-result.mjs
      - name: Upload compatibility results and runtime provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bd-firefox-compatibility-${{ matrix.group }}-${{ github.sha }}
          path: |
            e2e/results.json
            e2e/test-results/
            dist/*-amo.zip.sha256
            dist/*-amo.zip.build.json
          if-no-files-found: error
          retention-days: 14

  # Linux, both macOS architectures and the pinned Firefox 128 job must pass.
  e2e:
    if: ${{ always() }}
    needs: [scenarios, macos, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require Linux groups, both macOS jobs and pinned Firefox 128
        env:
          SCENARIO_RESULT: ${{ needs.scenarios.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: |
          test "$SCENARIO_RESULT" = success
          test "$MACOS_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
