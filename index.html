<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" type="text/css" href="styles/common.css">
  <link rel="stylesheet" type="text/css" href="styles/popup.css">
  <link rel="stylesheet" type="text/css" href="styles/controls.css">
  <link rel="stylesheet" href="styles/modal.css" type="text/css" media="all" />
  <link rel="stylesheet" href="styles/feedback-modal.css" type="text/css" media="all" />
  <title data-i18n="defaulttitle"></title>
  <link rel="stylesheet" href="styles/focus-schedule.css">
</head>

<body>
  <div id="custom-alert" class="custom-alert" role="status" aria-live="polite" aria-atomic="true" dir="auto"></div>
  <div id="header">
    <h1 data-i18n="header"></h1>
    <div id="security-mode-display">
      <span id="mode-label" data-i18n="securitymodetitle">Security Mode:</span>
      <span id="current-mode" data-i18n="normalmodetitle">Normal Mode</span>
    </div>
    <div id="blocking-summary" class="blocking-summary" aria-live="polite">
      <span data-i18n="blockedtodaylabel">Blocked Today</span>
      <strong id="popup-blocked-today">0</strong>
    </div>
    <div class="header-links">
      <button type="button" id="options-link" data-i18n="gotooptions" data-action="open-options">Go to options page ⚙️</button>
      <a href="https://blockdistraction.com/user-guide.html" target="_blank" rel="noopener noreferrer" data-i18n="userguide">User Guide</a>
    </div>
    <p data-i18n="paragraph"></p>
  </div>
  
  <div id="motivational-quote"></div>
  
  <div id="focus-session-section" class="focus-section hidden">
    <div class="focus-header">
      <h3 data-i18n="focussessionheader"></h3>
      <span class="focus-info" data-i18n="focussessioninfo"></span>
    </div>
    <div id="focus-controls">
      <div id="focus-start-view">
        <div class="duration-control">
          <label for="focus-duration" data-i18n="focussessionduration"></label>
          <input type="number" id="focus-duration" value="25" min="1" max="240">
          <small id="focus-pro-note" class="pro-note hidden" data-i18n="focussessionprofeature"></small>
        </div>
        <p id="focus-duration-error" class="focus-field-error" hidden></p>
        <div id="focus-mode-control" class="focus-mode-control hidden">
          <label for="focus-mode-select" data-i18n="focussessionmode">Mode:</label>
          <select id="focus-mode-select">
            <option value="blacklist" data-i18n="focusmodeblacklist">Block Blacklist</option>
            <option value="whitelist" data-i18n="focusmodewhitelist">Allow Whitelist Only</option>
          </select>
        </div>
        <div id="hardcore-mode-control" class="hardcore-control hidden">
          <input type="checkbox" id="focus-hardcore-mode">
          <label for="focus-hardcore-mode" data-i18n="focussessionhardcore"></label>
        </div>
        <button type="button" id="start-focus-btn" class="action-btn" data-i18n="focussessionstart"></button>
      </div>
      <div id="focus-active-view" class="hidden">
        <p id="focus-active-label" tabindex="-1" data-i18n="focussessionactivebanner"></p>
        <div id="focus-timer-display" role="timer" aria-live="off" aria-labelledby="focus-active-label">00:00</div>
        <p id="focus-hardcore-description" data-i18n="focussessionhardcore" hidden></p>
        <button type="button" id="stop-focus-btn" class="action-btn delete-btn" data-i18n="focussessionstop"></button>
      </div>
    </div>
    <div class="focus-schedule-summary" data-focus-schedule dir="auto">
      <a class="focus-schedule-popup-link" href="options/options.html#focus-schedule" target="_blank" data-i18n="focus_schedule_title">Scheduled focus</a>
      <p data-focus-status aria-live="polite"></p>
      <p data-focus-skipped></p>
      <button type="button" data-focus-skip data-i18n="focus_schedule_skip" hidden>Skip next session</button>
      <p data-focus-notice role="status" aria-live="polite"></p>
    </div>
  </div>
  
  <div class="controls">
    <button id="add-rule" title="Add new rule" data-i18n="addrule"></button>
    <button id="add-whitelist-rule" title="Pro mode required" data-i18n="addwhitelistrule" disabled></button>
    
    <button id="feedback-btn" title="Send feedback">
      <span data-i18n="sendfeedbackbutton">Send Feedback</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
        <path d="M20 4H4C2.897 4 2 4.897 2 6v12c0 1.103.897 2 
             2 2h16c1.103 0 2-.897 2-2V6c0-1.103-.897-2-2-2zM4 
             6h16l-8 5L4 6zm0 12V8l8 5 8-5v10H4z" />
      </svg>
    </button>
  </div>
  <output id="status"></output>
  <div id="rules-container"></div>
  
  <dialog id="feedback-dialog" class="native-dialog" aria-labelledby="feedback-title" aria-describedby="feedback-description" aria-modal="true">
    <div class="dialog-content">
      <button id="feedback-close-btn" class="dialog-close-btn" type="button" aria-label="Cancel" data-i18n-aria-label="cancelbtn" autofocus>&times;</button>
      <h3 id="feedback-title" data-i18n="sendfeedbackbutton">Send Feedback</h3>
      <p id="feedback-description" data-i18n="feedback_desc">Your feedback really helps us improve the extension.</p>
      <div class="dialog-actions">
        <button id="feedback-review-btn" class="action-btn primary" type="button">
          <span class="feedback-finger" aria-hidden="true">⭐</span>
          <span id="feedback-store-label">Mozilla Add-ons</span>
        </button>
        <button id="feedback-support-btn" class="action-btn secondary" type="button">
          <span aria-hidden="true">✉</span>
          <span data-i18n="sendfeedbackbutton">Send Feedback</span>
        </button>
      </div>
      <p id="feedback-error" role="alert" aria-atomic="true"></p>
    </div>
  </dialog>
  
  <dialog id="passwordModal" class="modal hidden" aria-labelledby="modalTitle" aria-modal="true">
    <div class="modal-content">
      <h3 id="modalTitle">Set Password</h3>
      <label id="passwordInput1Label" for="passwordInput1" data-i18n="enterpassword">Enter password</label>
      <input type="password" id="passwordInput1" aria-describedby="passwordError" autocomplete="current-password" autofocus>
      <label id="passwordInput2Label" for="passwordInput2" data-i18n="confirmpassword" hidden>Confirm password</label>
      <input type="password" id="passwordInput2" aria-describedby="passwordError" autocomplete="new-password" hidden>
      <button type="button" id="confirmPassword" data-i18n="modalconfirm">Confirm</button>
      <button type="button" id="cancelPassword" data-i18n="modalcancel">Cancel</button>
      <p id="passwordError" class="error password-error" role="alert" aria-atomic="true"></p>
      <button type="button" id="forgotPassword" class="hidden" data-i18n="forgotpassword" hidden>Forgot password? Reset (will clear protection)</button>
    </div>
  </dialog>
  
  <div class="privacy-container">
    <div class="privacy-badge" title="We do not track your history">
      <span>🔒</span><span data-i18n="privacysecured">Privacy Secured</span>
    </div>
  </div>
  
  <button type="button" id="scrollToTopBtn" class="scrollToTopBtn" aria-label="Back to top" data-i18n-aria-label="scrolltotop" hidden><span aria-hidden="true">↑</span></button>
  
  <script type="module" src="scripts/i18n.js"></script>
  <script type="module" src="popup.js"></script>
  <script type="module" src="schedules/focusScheduleUI.js"></script>
</body>

</html>
